# Failure Analyzer base theme.
# Detailed styling (DM Sans font + full palette) is applied at runtime by
# theme.inject_theme(); these values make Streamlit's native chrome match.

[theme]
base = "light"
primaryColor = "#7C3AED"          # Kiro purple
backgroundColor = "#FFFFFF"       # white canvas
secondaryBackgroundColor = "#F4F1FB"  # panels / sidebar (soft lavender white)
textColor = "#211B33"
font = "sans serif"

[browser]
gatherUsageStats = false
